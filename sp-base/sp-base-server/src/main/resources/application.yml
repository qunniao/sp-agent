# ============================================================
# SP-Base 应用配置
# ============================================================

server:
  port: 8080

spring:
  application:
    name: sp-base

  # ---- 数据源 ----
  datasource:
    url: jdbc:mysql://localhost:3306/sp_base?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Jackson 日期格式 ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- 日志级别 ----
logging:
  level:
    com.sp.base: debug
    org.springframework: warn

# ---- Actuator 健康检查（Docker / K8s 探活） ----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
