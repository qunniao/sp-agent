server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: sp-agent
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 单一 PostgreSQL 实例：业务表 + pgvector 向量表共用
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:sp_agent}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
  # 启动时执行建表脚本（幂等，仅开发/演示用；生产建议手工管理 DDL）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
          temperature: 0.7
      embedding:
        options:
          dimensions: 1024
      rerank:
        options:
          model: qwen3-rerank
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        # 首次启动自动建向量表（生产可改为 false + 手工 DDL）
        initialize-schema: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.spagent: debug
