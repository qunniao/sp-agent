spring:
  application:
    name: sp-ai
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:nacos:8848}
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: nacos
        password: ${NACOS_PASSWORD}
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        username: nacos
        password: ${NACOS_PASSWORD}
  config:
    import:
      - nacos:sp-ai.yaml

# 技能安全阈值，可在 Nacos 的 sp-ai.yaml 中覆盖
sp-ai:
  skill:
    order-amount:
      default-range-days: 30
      max-range-days: 366
      rate-limit-per-minute: 5
