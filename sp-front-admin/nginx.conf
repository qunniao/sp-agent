server {
    listen 80;
    server_name _;

    # Docker 内置 DNS：动态解析后端容器 IP，避免后端重建后 502
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # sp-ai 后端（控制器自带 /api 前缀，原样转发）
    set $sp_ai http://sp-ai:8081;
    location /api/kb       { proxy_pass $sp_ai; }
    location /api/chat     { proxy_pass $sp_ai; }
    location /api/intent   { proxy_pass $sp_ai; }
    location /api/customer { proxy_pass $sp_ai; }
    location /api/orders   { proxy_pass $sp_ai; }
    location /api/risk     { proxy_pass $sp_ai; }

    # sp-base 后端（控制器无 /api 前缀，转发前剥掉）
    set $sp_base http://sp-base:8080;
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $sp_base;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
